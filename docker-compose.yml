# Environnement Docker de développement : Django, PostgreSQL et Ollama.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:3b
#
# Les secrets restent dans EduSpark/.env (non versionné) ; seules les adresses
# des services sont surchargées ici.
#
# Windows / macOS : Ollama dans Docker n'utilise pas le GPU et devient lent.
# Préférez Ollama installé sur le PC, lancez « docker compose up -d web db »
# et mettez OLLAMA_URL=http://host.docker.internal:11434 dans .env.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eduspark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduspark"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama   # modèles téléchargés conservés entre deux redémarrages
    ports:
      - "11434:11434"

  web:
    image: python:3.13-slim
    working_dir: /app/EduSpark
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: EduSpark/.env
    environment:
      DJANGO_DB_HOST: db
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-postgres}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama:
