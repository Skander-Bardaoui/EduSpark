<article class="rounded-2xl border border-outline-variant/40 bg-surface-container-lowest p-5 shadow-sm">
<div class="flex items-start justify-between gap-3">
<p class="font-label-md text-label-md text-on-surface-variant">{{ label }}</p>
<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl {{ icon_class|default:'bg-surface-container text-primary' }}">
<span class="material-symbols-outlined text-[20px]">{{ icon }}</span>
</span>
</div>
<p class="mt-2 font-data-metric text-kpi font-bold leading-none text-on-surface">{{ value }}{% if suffix %}<span class="text-base font-normal text-outline">{{ suffix }}</span>{% endif %}</p>
{% if hint %}<p class="mt-2 text-body-sm leading-snug text-on-surface-variant">{{ hint }}</p>{% endif %}
</article>
