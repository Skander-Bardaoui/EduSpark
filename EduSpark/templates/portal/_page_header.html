<header class="mb-6 flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
<div class="min-w-0">
{% if eyebrow %}<p class="mb-1 font-label-sm text-label-sm font-bold uppercase tracking-[0.16em] text-primary">{{ eyebrow }}</p>{% endif %}
<h1 class="font-headline-md text-headline-md tracking-tight text-on-surface">{{ title }}</h1>
{% if subtitle %}<p class="mt-1 max-w-3xl font-body-md text-body-md text-on-surface-variant">{{ subtitle }}</p>{% endif %}
</div>
</header>
