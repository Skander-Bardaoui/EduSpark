{% extends "users/base_app.html" %}
{% block title %}{{ delete_title }}{% endblock %}
{% block content %}
<div class="w-full max-w-xl p-space-lg rounded-xl bg-surface-container-lowest shadow-[0_8px_30px_rgba(6,22,75,0.06)] flex flex-col gap-space-md">
  <div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center"><span class="material-symbols-outlined text-error">delete_forever</span></div>
  <h1 class="font-headline-md text-headline-md text-on-background">{{ delete_title }}</h1>
  <p class="font-body-lg text-body-lg text-on-surface"><strong>{{ object }}</strong></p>
  <p class="font-body-md text-body-md text-on-surface-variant">{{ delete_warning }}</p>
  <form method="post" class="flex flex-col-reverse sm:flex-row sm:justify-end gap-space-sm pt-space-sm">
    {% csrf_token %}
    <a href="{{ cancel_url }}" class="inline-flex items-center justify-center px-space-lg py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container-low font-label-md text-label-md">Annuler</a>
    <button type="submit" class="inline-flex items-center justify-center gap-space-xs px-space-lg py-2.5 rounded-lg bg-error text-on-error font-label-md text-label-md font-bold hover:opacity-90"><span class="material-symbols-outlined text-[18px]">delete</span>Confirmer la suppression</button>
  </form>
</div>
{% endblock %}
