{% if match in url_name or match2 and match2 in url_name %}<a href="{% url url_target %}" aria-current="page" class="flex items-center gap-space-sm px-space-sm py-2 rounded-lg font-label-md text-label-md transition-colors bg-surface-container-lowest text-primary shadow-sm font-bold"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">{{ icon }}</span>{{ label }}</a>{% else %}<a href="{% url url_target %}" class="flex items-center gap-space-sm px-space-sm py-2 rounded-lg font-label-md text-label-md transition-colors text-on-surface-variant hover:bg-surface-container hover:text-on-surface"><span class="material-symbols-outlined text-[20px]">{{ icon }}</span>{{ label }}</a>{% endif %}
