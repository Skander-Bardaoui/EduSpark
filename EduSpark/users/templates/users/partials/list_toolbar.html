<form method="get" class="flex flex-wrap gap-space-sm p-space-sm rounded-xl bg-surface-container-low" role="search">
  <label class="relative flex-[1_1_16rem] min-w-0">
    <span class="sr-only">Rechercher</span>
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">search</span>
    <input type="search" name="q" value="{{ q }}" placeholder="{{ search_placeholder }}" class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:shadow-[0_0_0_2px_rgba(0,88,190,0.3)]"/>
  </label>
  {% if filters %}<div class="flex flex-wrap gap-space-sm">
    {% for f in filters %}
    <label class="min-w-[9rem]"><span class="sr-only">{{ f.label }}</span>
      <select name="{{ f.param }}" onchange="this.form.submit()" class="w-full px-3 py-2.5 bg-surface-container-lowest rounded-lg font-label-md text-label-md text-on-surface outline-none focus:shadow-[0_0_0_2px_rgba(0,88,190,0.3)]">
        <option value="">{{ f.label }} : tous</option>
        {% for value, label in f.choices %}<option value="{{ value }}" {% if f.current == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    {% endfor %}
  </div>{% endif %}
  <div class="flex gap-space-sm">
    <button type="submit" class="inline-flex items-center justify-center gap-space-xs px-space-md py-2.5 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-primary font-label-md text-label-md font-bold transition-colors"><span class="material-symbols-outlined text-[18px]">filter_alt</span>Filtrer</button>
    {% if is_filtered %}<a href="{{ request.path }}" class="inline-flex items-center justify-center gap-space-xs px-space-md py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container font-label-md text-label-md transition-colors"><span class="material-symbols-outlined text-[18px]">close</span>Réinitialiser</a>{% endif %}
  </div>
</form>
<p class="font-label-sm text-label-sm text-on-surface-variant -mt-space-sm">{{ paginator.count }} résultat{{ paginator.count|pluralize }}</p>
