{% if is_paginated %}
<nav class="flex items-center justify-between gap-space-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" class="inline-flex items-center gap-space-xs px-space-md py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md"><span class="material-symbols-outlined text-[18px]">chevron_left</span>Précédent</a>{% else %}<span></span>{% endif %}
  <span class="font-data-metric text-data-metric text-on-surface-variant">Page {{ page_obj.number }} / {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" class="inline-flex items-center gap-space-xs px-space-md py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md">Suivant<span class="material-symbols-outlined text-[18px]">chevron_right</span></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
