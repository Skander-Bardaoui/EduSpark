{% if inv.status == "accepted" %}<span class="px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm">{{ inv.display_status }}</span>{% elif inv.status == "revoked" or inv.is_expired %}<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm">{{ inv.display_status }}</span>{% else %}<span class="px-2 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm">{{ inv.display_status }}</span>{% endif %}
