<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef3fb;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#14213d;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef3fb;padding:32px 12px;">
<tr>
<td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 18px 45px rgba(15,42,100,0.12);">
<tr>
<td style="background-color:#1d3f91;background-image:linear-gradient(135deg,#163a8a 0%,#2457d6 100%);padding:28px 32px;">
<p style="margin:0;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#bcd0ff;font-weight:700;">EduSpark</p>
<h1 style="margin:10px 0 0;font-size:23px;line-height:1.3;color:#ffffff;font-weight:700;">{% block heading %}{{ subject }}{% endblock %}</h1>
<p style="margin:7px 0 0;font-size:13px;line-height:1.5;color:#dbe6ff;">{{ university_name }}</p>
</td>
</tr>
<tr>
<td style="padding:30px 32px 6px;">
{% block body %}{% endblock %}
</td>
</tr>
{% if cta_url %}
<tr>
<td style="padding:6px 32px 30px;">
<table role="presentation" cellpadding="0" cellspacing="0">
<tr>
<td style="border-radius:999px;background-color:#2457d6;">
<a href="{{ cta_url }}" style="display:inline-block;padding:13px 24px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:999px;">{{ cta_label }}</a>
</td>
</tr>
</table>
</td>
</tr>
{% endif %}
<tr>
<td style="background-color:#f6f9ff;border-top:1px solid #e2eafc;padding:20px 32px;">
<p style="margin:0;font-size:12px;line-height:1.6;color:#5b6b8c;">{{ footer_note|default:"Cet e-mail vous a été envoyé automatiquement par EduSpark." }}</p>
<p style="margin:7px 0 0;font-size:12px;color:#8a97b3;">EduSpark · {{ university_name }}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
