<label class="flex items-center gap-3 rounded-xl border border-outline-variant/40 bg-surface px-3 py-2.5 cursor-pointer transition-colors hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-primary-fixed">
<input type="{{ widget.type }}" name="{{ widget.name }}" value="{{ widget.value|stringformat:'s' }}"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}{% if widget.selected %} checked{% endif %} class="h-4 w-4 shrink-0 rounded accent-primary"/>
<span class="text-sm font-semibold text-on-surface">{{ widget.label }}</span>
</label>
