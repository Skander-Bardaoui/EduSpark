{% load static %}
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mot de passe modifié - EduSpark</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#f3f2ff] flex items-center justify-center p-6">
<div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
<div class="flex items-center gap-2 mb-6">
<img src="{% static 'landing/img/logo.png' %}" alt="EduSpark logo" class="w-9 h-9 rounded-lg object-cover"/>
<img src="{% static 'landing/img/eduspark.png' %}" alt="EduSpark" class="h-6 w-auto object-contain object-left"/>
</div>
<h1 class="text-2xl font-bold text-[#06164b]">Mot de passe modifié !</h1>
<p class="mt-2 text-sm text-gray-600">Votre mot de passe a été mis à jour. Vous pouvez vous connecter.</p>
<p class="mt-6 text-sm text-center"><a class="inline-block px-6 py-2.5 rounded-lg bg-[#0058be] text-white font-semibold hover:bg-[#2170e4] transition-colors" href="{% url 'accounts:login' %}">Se connecter</a></p>
</div></body></html>
