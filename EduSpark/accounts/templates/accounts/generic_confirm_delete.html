{% extends "portal/base_admin.html" %}
{% block title %}{{ delete_title }} — Hub Éducatif Multimodal{% endblock %}
{% block content %}
<main class="w-full min-h-[calc(100vh-4rem)] bg-surface" id="main-content">
<div class="mx-auto flex w-full max-w-[720px] flex-col gap-5 px-4 py-10 sm:px-6">
<section class="rounded-2xl border border-error/20 bg-surface-container-lowest p-6 shadow-sm">
<div class="flex items-start gap-4">
<span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-error-container text-error"><span class="material-symbols-outlined text-[24px]">warning</span></span>
<div class="min-w-0">
<p class="font-label-sm text-label-sm font-bold uppercase tracking-[0.16em] text-error">Confirmation</p>
<h1 class="mt-1 font-headline-md text-headline-md font-bold tracking-tight text-on-surface">{{ delete_title }}</h1>
<p class="mt-2 text-sm text-on-surface-variant">Objet concerné : <span class="font-semibold text-on-surface">{{ object }}</span></p>
<p class="mt-3 rounded-lg bg-error-container/60 px-4 py-3 text-sm text-on-error-container">{{ delete_warning }}</p>
</div>
</div>
<form class="mt-6 flex flex-wrap justify-end gap-2 border-t border-outline-variant/40 pt-4" method="post">
{% csrf_token %}
<a class="inline-flex items-center rounded-full border border-outline-variant/70 px-4 py-2.5 text-xs font-bold text-on-surface-variant transition-colors hover:bg-surface-container" href="{{ cancel_url }}">Annuler</a>
<button class="inline-flex items-center gap-2 rounded-full bg-error px-5 py-2.5 text-xs font-bold text-on-error transition-colors hover:opacity-90" type="submit">
<span class="material-symbols-outlined text-[18px]">delete</span>Confirmer la suppression
</button>
</form>
</section>
</div>
</main>
{% endblock %}
