{% load static %}
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mot de passe oublié - EduSpark</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#f3f2ff] flex items-center justify-center p-6">
<div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
<div class="flex items-center gap-2 mb-6">
<img src="{% static 'landing/img/logo.png' %}" alt="EduSpark logo" class="w-9 h-9 rounded-lg object-cover"/>
<img src="{% static 'landing/img/eduspark.png' %}" alt="EduSpark" class="h-6 w-auto object-contain object-left"/>
</div>
<h1 class="text-2xl font-bold text-[#06164b]">Mot de passe oublié ?</h1>
<p class="mt-2 text-sm text-gray-600">Entrez votre adresse e-mail : nous vous enverrons un lien de réinitialisation.</p>
<form method="post" class="mt-6 flex flex-col gap-4">{% csrf_token %}
{% if form.errors %}<p class="text-sm text-red-600">Veuillez corriger les erreurs ci-dessous.</p>{% endif %}
<label class="text-sm font-semibold text-[#06164b]" for="id_email">Adresse e-mail</label>
<input class="w-full px-4 py-2.5 bg-[#f3f2ff] rounded-lg outline-none focus:ring-2 focus:ring-[#0058be]" type="email" name="email" id="id_email" required placeholder="nom@universite.fr"/>
<button class="w-full py-2.5 rounded-lg bg-[#0058be] text-white font-semibold hover:bg-[#2170e4] transition-colors" type="submit">Envoyer le lien</button>
</form>
<p class="mt-4 text-sm text-center"><a class="text-[#0058be] hover:underline" href="{% url 'accounts:login' %}">Retour à la connexion</a></p>
</div></body></html>
